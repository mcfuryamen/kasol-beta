<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>Kasir Solo - Retail</title>
<meta name="description" content="Aplikasi kasir & manajemen toko retail offline — Kasir Solo, oleh PT Mesin Kasir Solo.">

<!-- PWA Meta Tags -->
<link rel="manifest" href="manifest.json">
<link rel="icon" sizes="16x16" href="favicon-16.png">
<link rel="icon" sizes="32x32" href="favicon-32.png">
<link rel="icon" sizes="192x192" href="icon-192.png">
<link rel="icon" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-192.png">
<meta name="theme-color" content="#F7871E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="msapplication-TileColor" content="#F7871E">

<style>
:root{
  --brand-1:#FDB44B;
  --brand-2:#F7871E;
  --brand-3:#E8531E;
  --cream:#FFF8EF;
  --cream-2:#FFF1DE;
  --paper:#FFFFFF;
  --ink:#2B2118;
  --ink-soft:#7A6A5A;
  --line:#F0DFC8;
  --green:#2E9E5B;
  --green-bg:#E7F6ED;
  --red:#E23E3E;
  --red-bg:#FDEAEA;
  --amber:#C9820A;
  --amber-bg:#FFF3DC;
  --shadow-sm:0 1px 2px rgba(70,40,10,.06),0 1px 1px rgba(70,40,10,.04);
  --shadow-md:0 6px 16px rgba(90,50,10,.10),0 2px 6px rgba(90,50,10,.06);
  --shadow-lg:0 20px 50px rgba(70,40,10,.18);
  --radius:20px;
  --radius-sm:12px;
  --font-display:-apple-system,'Segoe UI Rounded','SF Pro Rounded','Segoe UI',system-ui,sans-serif;
  --font-body:-apple-system,'Segoe UI',system-ui,Roboto,sans-serif;
  --font-num:ui-monospace,'SF Mono','Cascadia Mono',Consolas,monospace;
  --sidebar-w:230px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--cream);color:var(--ink);
  font-family:var(--font-body);
  -webkit-tap-highlight-color:transparent;
  overflow:hidden;
}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
::selection{background:var(--brand-1);color:#fff}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;font-weight:700}
.hide{display:none !important}
.scrollbar-thin::-webkit-scrollbar{width:8px;height:8px}
.scrollbar-thin::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
a{color:var(--brand-3)}

/* ---------- App shell ---------- */
#app{height:100%;display:flex;flex-direction:column}
.appshell{display:flex;flex:1;min-height:0}

/* Sidebar (desktop) */
.sidebar{
  width:var(--sidebar-w);flex:none;background:linear-gradient(180deg,#FFFDF9,var(--cream-2));
  border-right:1px solid var(--line);display:none;flex-direction:column;padding:18px 14px;gap:4px;
  overflow-y:auto;
}
.sidebar .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px}
.sidebar .brand img{width:38px;height:38px;border-radius:50%}
.sidebar .brand .name{font-family:var(--font-display);font-size:17px;line-height:1.1}
.sidebar .brand .dev{font-size:10.5px;color:var(--ink-soft)}
.navitem{
  display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;border:none;
  background:transparent;text-align:left;font-size:14.5px;font-weight:600;color:var(--ink-soft);
  transition:background .15s,color .15s;
}
.navitem .ic{font-size:18px;width:22px;text-align:center}
.navitem:hover{background:var(--cream-2)}
.navitem.active{background:linear-gradient(135deg,var(--brand-1),var(--brand-3));color:#fff;box-shadow:var(--shadow-sm)}
.sidebar-foot{margin-top:auto;padding-top:14px;font-size:11px;color:var(--ink-soft);border-top:1px solid var(--line)}

/* Main column */
.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.topbar{
  display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--paper);
  border-bottom:1px solid var(--line);flex:none;
}
.topbar .title{flex:1;font-family:var(--font-display);font-size:19px}
.topbar .badge-trial{font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--amber-bg);color:var(--amber);white-space:nowrap}
.topbar .badge-cashier{font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--cream-2);border:1px solid var(--line);white-space:nowrap;display:flex;align-items:center;gap:6px}
.topbar-logo-mobile{display:flex;align-items:center;gap:8px}
.topbar-logo-mobile img{width:30px;height:30px;border-radius:50%}

.view{flex:1;min-height:0;overflow-y:auto;padding:14px 16px 90px}
@media(min-width:900px){.view{padding:20px 26px 26px}}

/* Bottom nav (mobile) */
.bottomnav{
  position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--paper);
  border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(90,50,10,.08);z-index:40;
  padding-bottom:env(safe-area-inset-bottom);
}
.bottomnav button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;
  background:none;border:none;font-size:10.5px;font-weight:700;color:var(--ink-soft);
}
.bottomnav button .ic{font-size:19px}
.bottomnav button.active{color:var(--brand-3)}

@media(min-width:900px){
  .sidebar{display:flex}
  .bottomnav{display:none}
  .view{padding-bottom:26px}
}

/* ---------- Cards / generic ---------- */
.card{background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow-sm);border:1px solid var(--line);padding:16px}
.card-tight{padding:12px}
.grid{display:grid;gap:12px}
.grid-2{grid-template-columns:1fr 1fr}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:640px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr 1fr}}
.row{display:flex;align-items:center}
.between{justify-content:space-between}
.gap-8{gap:8px}.gap-10{gap:10px}.gap-12{gap:12px}.gap-16{gap:16px}
.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}.mt-20{margin-top:20px}
.muted{color:var(--ink-soft)}
.small{font-size:12.5px}
.tiny{font-size:11px}
.bold{font-weight:700}
.center{text-align:center}
.wfull{width:100%}

.btn{
  border:none;border-radius:14px;padding:12px 18px;font-weight:700;font-size:14.5px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s,filter .15s;
}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--brand-1),var(--brand-3));color:#fff;box-shadow:var(--shadow-sm)}
.btn-primary:hover{filter:brightness(1.05)}
.btn-soft{background:var(--cream-2);color:var(--ink);border:1px solid var(--line)}
.btn-soft:hover{background:#FFEBCF}
.btn-outline{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn-danger{background:var(--red-bg);color:var(--red)}
.btn-danger-solid{background:var(--red);color:#fff}
.btn-green{background:var(--green);color:#fff}
.btn-sm{padding:8px 12px;font-size:13px;border-radius:11px}
.btn-lg{padding:16px 20px;font-size:16.5px;border-radius:16px}
.btn-icon{padding:9px;border-radius:12px;line-height:0}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-block{width:100%}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;font-weight:700;color:var(--ink-soft)}
.input,select.input,textarea.input{
  border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;font-size:14.5px;background:var(--paper);
  width:100%;outline:none;transition:border-color .15s;
}
.input:focus{border-color:var(--brand-2)}
textarea.input{resize:vertical;min-height:64px}
.input-icon-wrap{position:relative}
.input-icon-wrap .input{padding-left:38px}
.input-icon-wrap .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.55}

.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:700}
.badge-green{background:var(--green-bg);color:var(--green)}
.badge-red{background:var(--red-bg);color:var(--red)}
.badge-amber{background:var(--amber-bg);color:var(--amber)}
.badge-gray{background:#EFEAE2;color:var(--ink-soft)}

table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);padding:8px 10px;border-bottom:2px solid var(--line)}
td{padding:10px 10px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:none}
.table-wrap{overflow-x:auto;border-radius:var(--radius-sm)}

.emptystate{display:flex;flex-direction:column;align-items:center;gap:8px;padding:40px 20px;color:var(--ink-soft);text-align:center}
.emptystate .ic{font-size:40px}

.section-title{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px}
.section-title h3{font-size:15px}
.section-title:first-child{margin-top:0}

/* Modal / sheet */
.overlay{position:fixed;inset:0;background:rgba(40,25,10,.45);display:flex;align-items:flex-end;justify-content:center;z-index:100;backdrop-filter:blur(1px)}
.sheet{
  background:var(--cream);width:100%;max-height:92vh;border-radius:22px 22px 0 0;overflow-y:auto;
  box-shadow:var(--shadow-lg);animation:slideup .22s ease-out;
}
@keyframes slideup{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes popin{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
@media(min-width:760px){
  .overlay{align-items:center}
  .sheet{width:min(560px,92vw);max-height:88vh;border-radius:22px;animation:popin .18s ease-out}
  .sheet.sheet-wide{width:min(880px,94vw)}
}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--cream);z-index:2}
.sheet-head h3{font-size:16.5px}
.sheet-body{padding:16px 18px 26px}
.close-x{border:none;background:var(--cream-2);width:32px;height:32px;border-radius:50%;font-size:16px;color:var(--ink-soft)}

/* Toast */
#toastwrap{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-md);animation:toastin .18s ease-out}
@keyframes toastin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}

/* Confirm dialog */
.confirm-box{background:var(--paper);border-radius:20px;padding:22px;width:min(360px,88vw);text-align:center;box-shadow:var(--shadow-lg);animation:popin .18s ease-out}
.confirm-box .ic{font-size:38px}
.confirm-actions{display:flex;gap:10px;margin-top:16px}
.confirm-actions .btn{flex:1}

/* Loading Overlay */
.loading-overlay{position:fixed;inset:0;background:rgba(40,25,10,.6);display:flex;align-items:center;justify-content:center;z-index:500;backdrop-filter:blur(2px)}
.loading-spinner{width:48px;height:48px;border:4px solid var(--cream-2);border-top-color:var(--brand-2);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{color:var(--cream);font-size:14px;font-weight:600;margin-top:12px}

/* ---------- Dashboard ---------- */
.stat-card{background:var(--paper);border-radius:var(--radius);padding:16px;border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.stat-card .lbl{font-size:12px;color:var(--ink-soft);font-weight:700}
.stat-card .val{font-family:var(--font-num);font-size:22px;font-weight:800;margin-top:4px}
.stat-card .sub{font-size:11.5px;margin-top:4px}
.dash-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:760px){.dash-grid{grid-template-columns:repeat(4,1fr)}}

/* register display */
.cash-display{
  background:linear-gradient(135deg,#241a12,#3a2717);border-radius:18px;padding:18px 20px;color:#FFE9C7;
  box-shadow:inset 0 0 0 1px rgba(255,200,120,.15);
}
.cash-display .lbl{font-size:11px;letter-spacing:.08em;opacity:.7;text-transform:uppercase}
.cash-display .amt{font-family:var(--font-num);font-size:32px;font-weight:800;letter-spacing:.01em}

/* ---------- POS ---------- */
.pos-wrap{display:flex;flex-direction:column;gap:14px;height:100%}
@media(min-width:900px){.pos-wrap{display:grid;grid-template-columns:1fr 360px;gap:16px;height:100%}}
.pos-left{display:flex;flex-direction:column;gap:12px;min-height:0}
.pos-cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--paper);border:1.5px solid var(--line);font-size:13px;font-weight:700;color:var(--ink-soft)}
.chip.active{background:linear-gradient(135deg,var(--brand-1),var(--brand-3));color:#fff;border-color:transparent}
.prod-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;overflow-y:auto;padding-bottom:8px}
@media(min-width:560px){.prod-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1100px){.prod-grid{grid-template-columns:repeat(4,1fr)}}
.prod-card{
  background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:10px;text-align:left;
  display:flex;flex-direction:column;gap:6px;position:relative;box-shadow:var(--shadow-sm);
}
.prod-card .emoji{font-size:26px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--cream-2);border-radius:12px}
.prod-card .pname{font-size:13px;font-weight:700;line-height:1.25;min-height:2.4em}
.prod-card .pprice{font-family:var(--font-num);font-weight:800;color:var(--brand-3);font-size:14px}
.prod-card .pstock{font-size:10.5px}
.prod-card[disabled]{opacity:.4}
.pos-cart{display:none}
@media(min-width:900px){.pos-cart{background:var(--paper);border-radius:var(--radius);border:1px solid var(--line);display:flex;flex-direction:column;min-height:0;box-shadow:var(--shadow-sm)}}
.cart-items{flex:1;overflow-y:auto;padding:10px 12px}
.cart-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dashed var(--line)}
.cart-row:last-child{border-bottom:none}
.cart-row .ci-name{font-size:12.5px;font-weight:700;flex:1;min-width:0}
.cart-row .ci-sub{font-size:10.5px;color:var(--ink-soft)}
.qtybox{display:flex;align-items:center;gap:6px;background:var(--cream-2);border-radius:10px;padding:2px}
.qtybox button{width:24px;height:24px;border:none;background:var(--paper);border-radius:7px;font-weight:800;box-shadow:var(--shadow-sm)}
.qtybox input{width:32px;text-align:center;border:none;background:transparent;font-weight:700;font-size:12.5px}
.cart-foot{padding:12px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.cart-total-row{display:flex;justify-content:space-between;font-size:13px}
.cart-total-row.grand{font-size:17px;font-weight:800;font-family:var(--font-num)}

/* bottom sheet becomes side panel on desktop for POS cart mobile trigger */
.pos-mobile-cartbar{
  position:fixed;left:12px;right:12px;bottom:66px;background:linear-gradient(135deg,var(--brand-1),var(--brand-3));
  color:#fff;border-radius:16px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;
  box-shadow:var(--shadow-lg);z-index:35;border:none;width:calc(100% - 24px);
}
@media(min-width:900px){.pos-mobile-cartbar{display:none}}

/* license overlay */
.license-overlay{position:fixed;inset:0;background:linear-gradient(160deg,#2A1B0F,#1a1108);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px}
.license-box{background:var(--cream);border-radius:24px;padding:26px;width:min(420px,94vw);max-height:92vh;overflow-y:auto;box-shadow:var(--shadow-lg)}

.kbd{display:inline-block;padding:2px 6px;border:1px solid var(--line);border-radius:6px;font-size:11px;background:var(--paper);font-family:var(--font-num)}

/* misc utility */
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-amber{background:var(--amber)}
.link-btn{background:none;border:none;color:var(--brand-3);font-weight:700;font-size:13px}
.searchbar{position:relative}
.searchbar .input{padding-left:38px}
.searchbar .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%)}
.fab{position:fixed;right:16px;bottom:78px;background:linear-gradient(135deg,var(--brand-1),var(--brand-3));color:#fff;border:none;width:54px;height:54px;border-radius:50%;font-size:24px;box-shadow:var(--shadow-lg);z-index:35}
@media(min-width:900px){.fab{position:static;box-shadow:none;width:auto;height:auto;border-radius:14px;padding:11px 18px;font-size:14.5px;font-weight:700;display:inline-flex;gap:8px}}

.tabbar{display:flex;gap:6px;background:var(--cream-2);padding:4px;border-radius:14px;width:fit-content}
.tabbar button{border:none;background:transparent;padding:8px 16px;border-radius:10px;font-weight:700;font-size:13px;color:var(--ink-soft)}
.tabbar button.active{background:var(--paper);color:var(--ink);box-shadow:var(--shadow-sm)}

.list-row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:none}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--cream-2);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--brand-3);flex:none}

.receipt{background:#fff;color:#111;font-family:var(--font-num);font-size:12.5px;padding:16px;border-radius:10px;border:1px dashed #ccc}
.receipt .center{text-align:center}
.receipt hr{border:none;border-top:1px dashed #999;margin:8px 0}
.receipt .rline{display:flex;justify-content:space-between}

@media print{
  body *{visibility:hidden}
  #printarea,#printarea *{visibility:visible}
  #printarea{position:absolute;left:0;top:0;width:100%}
}

.progress-bar{height:8px;background:var(--cream-2);border-radius:99px;overflow:hidden}
.progress-bar > div{height:100%;background:linear-gradient(90deg,var(--brand-1),var(--brand-3))}

.bar-chart{display:flex;align-items:flex-end;gap:6px;height:140px}
.bar-chart .bar{flex:1;background:linear-gradient(180deg,var(--brand-1),var(--brand-3));border-radius:6px 6px 0 0;min-height:3px;position:relative}
.bar-chart .bar .bv{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:9.5px;font-weight:700;color:var(--ink-soft)}
.bar-chart .bar .bl{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:9.5px;color:var(--ink-soft)}

.cashier-pick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.cashier-pick button{padding:18px 10px;border-radius:16px;border:1.5px solid var(--line);background:var(--paper);font-weight:700}
.cashier-pick button.selected{border-color:var(--brand-2);background:var(--cream-2)}

.split-desktop{display:block}
@media(min-width:900px){.split-desktop{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:start}}

.hide-mobile{display:none}
.hide-mobile-inline{display:none}
@media(min-width:900px){
  .hide-mobile{display:block}
  .hide-mobile-inline{display:inline}
  .topbar-logo-mobile{display:none}
}

</style>
</head>
<body>
<script src="dexie.min.js"></script>
<div id="app">
  <div class="appshell">
    <nav class="sidebar" id="sidebar"></nav>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="view scrollbar-thin" id="viewroot"></main>
    </div>
  </div>
  <nav class="bottomnav" id="bottomnav"></nav>
</div>
<div id="modalroot"></div>
<div id="toastwrap"></div>

<script>
const LOGO_SRC='logo.png';

/* ===== db.js ===== */
/* ============================================================
   MiniDB ÃÂ¢Ã¢ÂÂ¬Ã¢ÂÂ lightweight promise-based IndexedDB wrapper
   (self-contained, no external library ÃÂ¢Ã¢ÂÂ¬Ã¢ÂÂ mimics a small subset
   of a Dexie-style table API so the rest of the app can use
   simple async calls like db.products.add(...) / .toArray())
   ============================================================ */
// Dexie.js database initialization (replacing MiniDB)
const db = new Dexie('KasirSoloRetailDB');

// Define database schema
db.version(1).stores({
  products: '++id, category, sku, barcode',
  categories: '++id, name',
  customers: '++id, name, phone',
  suppliers: '++id, name, phone',
  cashiers: '++id, name',
  sales: '++id, date, cashierId, customerId, paymentStatus',
  purchases: '++id, date, supplierId, paymentStatus',
  payments: '++id, date, contactId, type',
  returns: '++id, date, type, refId',
  stockmoves: '++id, date, productId, type',
  cashbook: '++id, date, type, category',
  settings: 'id'
});

// Helper functions for Dexie (to maintain compatibility with old API)
db.exportAll = async function() {
  const data = {};
  for (const table of db.tables) {
    data[table.name] = await table.toArray();
  }
  return data;
};

db.importAll = async function(data) {
  await db.transaction('rw', ...db.tables, async () => {
    for (const tableName in data) {
      if (db[tableName]) {
        await db[tableName].clear();
        await db[tableName].bulkAdd(data[tableName]);
      }
    }
  });
};

function fmtRp(n){
  n=Math.round(Number(n)||0);
  return 'Rp' + n.toLocaleString('id-ID');
}
function fmtNum(n){ return Number(n||0).toLocaleString('id-ID'); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function nowISO(){ return new Date().toISOString(); }
function fmtDate(iso){
  if(!iso) return '-';
  const d=new Date(iso);
  return d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});
}
function fmtDateTime(iso){
  if(!iso) return '-';
  const d=new Date(iso);
  return d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'})+' '+
    d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
}
function genCode(prefix){
  const d=new Date();
  const y=d.getFullYear().toString().slice(2), m=String(d.getMonth()+1).padStart(2,'0'), dd=String(d.getDate()).padStart(2,'0');
  return `${prefix}${y}${m}${dd}-${Math.random().toString(36).slice(2,6).toUpperCase()}`;
}
function esc(s){
  return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function daysBetween(a,b){ return Math.floor((b-a)/86400000); }

function toast(msg,type='default'){
  const wrap=DOM.toastwrap;
  const el=document.createElement('div');
  el.className='toast';
  if(type==='error') el.style.background='var(--red)';
  if(type==='success') el.style.background='var(--green)';
  el.textContent=msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); },2200);
}

function drawBarChart(container,data,opts={}){
  // data: [{label, value}]
  const max=Math.max(1,...data.map(d=>d.value));
  container.innerHTML='<div class="bar-chart" style="margin-top:22px">'+
    data.map(d=>{

        <div class="bv">${opts.short? shortNum(d.value): fmtNum(d.value)}</div>
        <div class="bl">${esc(d.label)}</div>
      </div>`;
    }).join('')+'</div>';
}
function shortNum(n){
  n=Number(n)||0;
  if(n>=1000000) return (n/1000000).toFixed(1).replace(/\.0$/,'')+'jt';
  if(n>=1000) return (n/1000).toFixed(0)+'rb';
  return String(n);
}

function debounce(fn,ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; }

// Pagination helpers
function paginateArray(arr, page, perPage) {
  const start = (page - 1) * perPage;
  const end = start + perPage;
  return {
    data: arr.slice(start, end),
    totalPages: Math.ceil(arr.length / perPage),
    totalItems: arr.length,
    currentPage: page,
    hasNext: end < arr.length,
    hasPrev: page > 1
  };
}

function renderPaginationControls(containerId, pagination, onPageChange) {
  const { currentPage, totalPages, totalItems } = pagination;
  if (totalPages <= 1) return '';

      <span class="small muted">${totalItems} item (hal ${currentPage}/${totalPages})</span>

}

/* ---------------- Trial / License ---------------- */
const TRIAL_DAYS_BASE=7;
const TRIAL_MAX_BONUS=20;

async function ensureTrialStarted(){
  let s=await getSettings();
  if(!s.deviceId){ await setSetting('deviceId',getDeviceId()); }
  if(!s.trialStart){ await setSetting('trialStart',nowISO()); }
}

function trialInfo(s){
  const start=new Date(s.trialStart||nowISO());
  const totalDays=TRIAL_DAYS_BASE + Math.min(s.trialBonusDays||0,TRIAL_MAX_BONUS);
  const elapsed=daysBetween(start,new Date());
  const daysLeft=Math.max(0,totalDays-elapsed);
  const expired = !s.licenseActivated && daysLeft<=0;
  return {totalDays,elapsed,daysLeft,expired};
}

function cartSubtotal(){ return State.cart.reduce((a,i)=>a+ (i.price*i.qty - (i.discount||0)),0); }
function cartDiscountAmt(){
  const sub=cartSubtotal();
  if(State.cartDiscount.type==='percent') return Math.round(sub*(State.cartDiscount.value||0)/100);
  return Math.min(sub,State.cartDiscount.value||0);
}
function cartTaxAmt(sub){
  if(!State.cartTaxOn) return 0;
  return Math.round(sub*(State.settings.taxPercent||0)/100);
}
function cartGrandTotal(){
  const sub=cartSubtotal()-cartDiscountAmt();
  return Math.max(0,sub+cartTaxAmt(sub));
}

function addToCart(pid){
  const p=State.productsCache.find(x=>x.id===pid); if(!p) return;
  const existing=State.cart.find(i=>i.productId===pid);
  const inCartQty=existing?existing.qty:0;
  if(inCartQty+1>p.stock){ toast('Stok tidak cukup!','error'); return; }
  if(existing){ existing.qty++; }
  else{ State.cart.push({productId:p.id,name:p.name,price:p.sellPrice,buyPrice:p.buyPrice,unit:p.unit,qty:1,discount:0}); }
  refreshCartUI();
}
function setCartQty(pid,qty){
  const p=State.productsCache.find(x=>x.id===pid);
  const item=State.cart.find(i=>i.productId===pid); if(!item) return;
  qty=Math.max(0,Math.floor(Number(qty)||0));
  if(p && qty>p.stock){ toast('Stok tidak cukup!','error'); qty=p.stock; }
  if(qty<=0){ State.cart=State.cart.filter(i=>i.productId!==pid); }
  else item.qty=qty;
  refreshCartUI();
}

async function openBarcodeScanner(){
  const overlay=openModal(`
    <div class="sheet-head"><h3>ÃÂ°ÃÂ¸Ã¢ÂÂÃÂ· Scan Barcode</h3><button class="close-x" onclick="closeModal()">ÃÂ¢ÃÂÃ¢ÂÂ¢</button></div>
    <div class="sheet-body">
      ${'BarcodeDetector' in window ? `
        <video id="scan-video" style="width:100%;border-radius:12px;background:#000" playsinline autoplay></video>
        <p class="small muted center mt-8">Arahkan kamera ke barcode produk</p>
      ` : `
        <div class="field mt-12">
          <label>Masukkan Barcode Manual</label>
          <input class="input" id="manual-barcode" placeholder="Ketik atau scan barcode..." inputmode="numeric" autofocus>
        </div>
        <button class="btn btn-primary btn-block mt-12" id="submit-barcode">Cari Produk</button>
      `}
    </div>`);
  
  if(!('BarcodeDetector' in window)){
    const input = qs('#manual-barcode', overlay);
    const submitBtn = qs('#submit-barcode', overlay);
    const searchBarcode = () => {
      const val = input.value.trim();
      if (!val) return;
      closeModal(overlay);
      const p = State.productsCache.find(x => x.barcode === val);
      if(p) addToCart(p.id); 
      else toast('Produk dengan barcode '+val+' tidak ditemukan','error');
    };
    submitBtn.onclick = searchBarcode;
    input.onkeydown = (e) => { if(e.key === 'Enter') searchBarcode(); };
    return;
  }
  
  const video=qs('#scan-video',overlay);
  let stream;
  try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}); }
  catch(e){ toast('Tidak bisa mengakses kamera.','error'); closeModal(overlay); return; }
  video.srcObject=stream;
  const detector=new BarcodeDetector();
  let stop=false;
  overlay.addEventListener('click',(e)=>{ if(e.target===overlay || e.target.classList.contains('close-x')){ stop=true; stream.getTracks().forEach(t=>t.stop()); } });
  (async function loop(){
    while(!stop && document.body.contains(video)){
      try{
        const codes=await detector.detect(video);
        if(codes.length){
          const val=codes[0].rawValue;
          stop=true; stream.getTracks().forEach(t=>t.stop()); closeModal(overlay);
          const p=State.productsCache.find(x=>x.barcode===val);
          if(p) addToCart(p.id); else toast('Produk dengan barcode '+val+' tidak ditemukan','error');
          return;
        }
      }catch(e){}
      await new Promise(r=>setTimeout(r,350));
    }
  })();
}

    qs('#pay-change',overlay).style.color=c<0?'var(--red)':'var(--green)'; };
  recv.oninput=updateChange; updateChange();

  qs('#pay-confirm',overlay).onclick=async()=>{
    if(mode==='tunai' && (Number(recv.value)||0) < total){ toast('Uang diterima kurang dari total','error'); return; }
    const customerId=qs('#pay-customer',overlay).value ? Number(qs('#pay-customer',overlay).value) : null;
    if(mode==='tempo' && !customerId){ toast('Pilih pelanggan untuk transaksi tempo','error'); return; }
    const dp = mode==='tempo' ? (Number(qs('#pay-dp',overlay).value)||0) : total;
    const received = mode==='tunai' ? (Number(recv.value)||0) : dp;
    const btn=qs('#pay-confirm',overlay); 
    btn.disabled=true; 
    btn.textContent='MenyimpanÃÂ¢Ã¢ÂÂ¬ÃÂ¦';
    showLoading('Menyimpan transaksi...');
    try{
      const sale=await finalizeSale({mode,method:mode==='tunai'?method:'Tempo',customerId,total,received});
      hideLoading();
      closeModal(overlay);
      showReceipt(sale);
    }catch(err){ 
      hideLoading();
      console.error(err); 
      toast('Gagal menyimpan transaksi','error'); 
      btn.disabled=false; 
      btn.textContent='ÃÂ¢ÃÂÃ¢ÂÂ¦ Konfirmasi & Cetak Nota'; 
    }
  };
}

// Flag to prevent double-submit
let isProcessingSale = false;

async function finalizeSale({mode,method,customerId,total,received}){
  // Prevent double-submit
  if (isProcessingSale) {
    console.warn('Sale already in progress');
    return null;
  }
  
  isProcessingSale = true;
  
  try {
    const sub=cartSubtotal(), disc=cartDiscountAmt(), tax=cartTaxAmt(sub-disc);
    const paidAmount = mode==='tunai' ? total : received;
    const status = mode==='tunai' ? 'lunas' : (paidAmount>=total?'lunas':'tempo');
    const sale={
      code:genCode('TRX'), date:nowISO(), cashierId:State.activeCashierId, customerId,
      items:State.cart.map(i=>({productId:i.productId,name:i.name,price:i.price,buyPrice:i.buyPrice,qty:i.qty,discount:i.discount||0,unit:i.unit})),
      subtotal:sub, discountTotal:disc, tax, total, method, paymentStatus:status,
      paidAmount, changeAmount: mode==='tunai'? Math.max(0,received-total):0,
    };
    const id=await db.sales.add(sale); sale.id=id;

    for(const it of sale.items){
      const p=await db.products.get(it.productId);
      if(p){ p.stock=Math.max(0,p.stock-it.qty); await db.products.put(p); }
      await db.stockmoves.add({productId:it.productId,date:nowISO(),type:'sale',qty:-it.qty,note:'Penjualan '+sale.code,refId:sale.id});
    }
    if(mode==='tunai'){
      await db.cashbook.add({date:nowISO(),type:'in',amount:total,category:'Penjualan',note:sale.code,auto:true});
    } else {
      if(paidAmount>0) await db.cashbook.add({date:nowISO(),type:'in',amount:paidAmount,category:'Penjualan (DP)',note:sale.code,auto:true});
      const c=await db.customers.get(customerId);
      if(c){ c.balance=(c.balance||0)+(total-paidAmount); await db.customers.put(c); }
    }
    State.cart=[]; State.cartDiscount={type:'nominal',value:0};
    return sale;
  } catch (error) {
    console.error('Error in finalizeSale:', error);
    throw error;
  } finally {
    isProcessingSale = false;
  }
}

async function openReturnForm(type){
  const isSale=type==='sale';
  const source=isSale? (await db.sales.toArray()) : (await db.purchases.toArray());
  const overlay=openModal(`
    <div class="sheet-head"><h3>ÃÂ¢Ã¢ÂÂ ÃÂ©ÃÂ¯ÃÂ¸ÃÂ Retur ${isSale?'Penjualan':'Pembelian'}</h3><button class="close-x" onclick="closeModal()">ÃÂ¢ÃÂÃ¢ÂÂ¢</button></div>
    <div class="sheet-body">
      <div class="field"><label>Cari No. Transaksi</label>
        <select class="input" id="ret-ref">
          <option value="">ÃÂ¢Ã¢ÂÂ¬Ã¢ÂÂ Pilih transaksi ÃÂ¢Ã¢ÂÂ¬Ã¢ÂÂ</option>
          ${source.slice().reverse().slice(0,100).map(s=>`<option value="${s.id}">${esc(s.code)} ÃÂÃÂ· ${fmtRp(s.total)} ÃÂÃÂ· ${fmtDate(s.date)}</option>`).join('')}
        </select></div>
      <div id="ret-items-area" class="mt-12"></div>
      <div class="field mt-12"><label>Alasan Retur</label><textarea class="input" id="ret-reason" placeholder="Barang rusak, salah kirim, dll"></textarea></div>
      <div class="row between mt-8"><span class="bold">Total Retur</span><span class="bold" id="ret-total">Rp0</span></div>
      <button class="btn btn-primary btn-block btn-lg mt-16" id="ret-save">ÃÂ°ÃÂ¸Ã¢ÂÂÃÂ¾ Simpan Retur</button>
    </div>`,{wide:true});

  let refDoc=null, qtyMap={};
  qs('#ret-ref',overlay).onchange=async(e)=>{
    const id=Number(e.target.value); qtyMap={};
    refDoc = id? (isSale? await db.sales.get(id) : await db.purchases.get(id)) : null;
    renderRetItems();
  };
  function renderRetItems(){
    const area=qs('#ret-items-area',overlay);
    if(!refDoc){ area.innerHTML=''; qs('#ret-total',overlay).textContent='Rp0'; return; }
    const priceKey=isSale?'price':'buyPrice';
    area.innerHTML=refDoc.items.map((it,idx)=>`
      <div class="cart-row">
        <div style="flex:1" class="small">${esc(it.name)}<div class="tiny muted">maks ${it.qty} ${esc(it.unit||'')}</div></div>
        <input class="input" style="width:70px" data-retqty="${idx}" inputmode="numeric" value="0">
      </div>`).join('');
    qsa('[data-retqty]',area).forEach(inp=>inp.oninput=()=>{
      const idx=Number(inp.dataset.retqty); let v=Math.max(0,Math.min(refDoc.items[idx].qty,Number(inp.value)||0)); inp.value=v; qtyMap[idx]=v; updateRetTotal();
    });
    updateRetTotal();
  }
  function updateRetTotal(){
    if(!refDoc) return;
    const priceKey=isSale?'price':'buyPrice';
    let total=0; refDoc.items.forEach((it,idx)=>{ total += (qtyMap[idx]||0)*it[priceKey]; });
    qs('#ret-total',overlay).textContent=fmtRp(total);
  }

  qs('#ret-save',overlay).onclick=async()=>{
    if(!refDoc){ toast('Pilih transaksi referensi','error'); return; }
    const priceKey=isSale?'price':'buyPrice';
    const retItems=refDoc.items.map((it,idx)=>({productId:it.productId,name:it.name,qty:qtyMap[idx]||0,price:it[priceKey]})).filter(i=>i.qty>0);
    if(!retItems.length){ toast('Isi jumlah retur minimal 1 produk','error'); return; }
    const total=retItems.reduce((a,i)=>a+i.qty*i.price,0);
    const ret={type,refId:refDoc.id,refCode:refDoc.code,date:nowISO(),items:retItems,total,reason:qs('#ret-reason',overlay).value.trim()};
    await db.returns.add(ret);
    for(const it of retItems){
      const p=await db.products.get(it.productId);
      const delta= isSale? it.qty : -it.qty; // retur jual: stok balik masuk; retur beli: stok keluar lagi
      if(p){ p.stock=Math.max(0,p.stock+delta); await db.products.put(p); }
      await db.stockmoves.add({productId:it.productId,date:nowISO(),type:'return',qty:delta,note:'Retur '+refDoc.code,refId:ret.id});
    }
    if(isSale){
      if(refDoc.paymentStatus==='tempo' && refDoc.customerId){
        const c=await db.customers.get(refDoc.customerId);
        if(c){ c.balance=Math.max(0,(c.balance||0)-total); await db.customers.put(c); }
      } else {
        await db.cashbook.add({date:nowISO(),type:'out',amount:total,category:'Retur Penjualan',note:refDoc.code,auto:true});
      }
    } else {
      if(refDoc.paymentStatus==='tempo' && refDoc.supplierId){
        const s=await db.suppliers.get(refDoc.supplierId);
        if(s){ s.balance=Math.max(0,(s.balance||0)-total); await db.suppliers.put(s); }
      } else {
        await db.cashbook.add({date:nowISO(),type:'in',amount:total,category:'Retur Pembelian',note:refDoc.code,auto:true});
      }
    }
    closeModal(overlay); toast('Retur tersimpan','success'); navigate('returns');
  };
}

async function doRestore(e){

  const ok=await confirmDialog({icon:'ÃÂ¢ÃÂ¡ÃÂ ÃÂ¯ÃÂ¸ÃÂ',title:'Timpa semua data saat ini?',desc:'Data yang ada akan diganti dengan isi file backup. Tindakan ini tidak bisa dibatalkan.',okText:'Ya, impor'});
  if(!ok){ e.target.value=''; return; }
  
  showLoading('Mengimpor data...');

    const text=await file.text();

    hideLoading();
    toast('Data berhasil dipulihkan','success');
    location.reload();
  }catch(err){ 
    hideLoading();
    toast('File backup tidak valid','error'); 
    console.error(err);
  }
}

// Register Service Worker
async function registerServiceWorker(){
  if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){
    try {
      await navigator.serviceWorker.register('./sw.js');
      console.log('Service Worker registered successfully');
    } catch(e) {
      console.warn('Service Worker registration failed:', e);
    }
  }
}

async function firstRunWizardIfNeeded(){
  const s=State.settings;
  if(s.storeName && s.storeName!=='Toko Saya') return;
  return new Promise((resolve)=>{
    const overlay=openModal(`
      <div class="sheet-head"><h3>ÃÂ°ÃÂ¸Ã¢ÂÂÃ¢ÂÂ¹ Selamat Datang di Kasir Solo</h3></div>
      <div class="sheet-body">
        <p class="small muted">Yuk lengkapi identitas toko Anda dulu, ini akan tampil di nota transaksi.</p>
        <div class="field mt-12"><label>Nama Toko</label><input class="input" id="fw-name" placeholder="Toko Berkah Jaya"></div>
        <div class="field mt-12"><label>Alamat (opsional)</label><input class="input" id="fw-address" placeholder="Jl. Contoh No. 1"></div>
        <div class="field mt-12"><label>No. Telepon (opsional)</label><input class="input" id="fw-phone" placeholder="08xxxxxxxxxx"></div>
        <button class="btn btn-primary btn-block btn-lg mt-16" id="fw-save">Mulai Gunakan Aplikasi ÃÂ°ÃÂ¸ÃÂ¡Ã¢ÂÂ¬</button>
      </div>`,{persistent:true});
    qs('#fw-save',overlay).onclick=async()=>{
      const name=qs('#fw-name',overlay).value.trim()||'Toko Saya';
      await setSettings({storeName:name,storeAddress:qs('#fw-address',overlay).value.trim(),storePhone:qs('#fw-phone',overlay).value.trim()});
      closeModal(overlay); resolve();
    };
  });
}

async function bootApp(){
  initDOMCache(); // Initialize DOM cache
  document.getElementById('license-overlay')?.remove();
  await db.open(1);
  await seedIfEmpty();
  await ensureTrialStarted();
  State.settings=await getSettings();

  const info=trialInfo(State.settings);
  if(info.expired){
    renderLicenseOverlay();
    return;
  }

  renderShell();
  initDOMCache(); // Re-cache DOM after shell render
  await firstRunWizardIfNeeded();

  const savedCashier=localStorage.getItem('ks_active_cashier');
  if(savedCashier) State.activeCashierId=Number(savedCashier);
  State.cashiersCache=await db.cashiers.toArray();
  if(!State.activeCashierId && State.cashiersCache.length){
    updateTopbar();
    openCashierPicker(true);
  }

  updateTopbar();
  navigate('dashboard');
}

window.addEventListener('DOMContentLoaded',()=>{
  registerServiceWorker();
  bootApp();
});

</script>
