/* Sumber tunggal masa berlaku trial: timestamp absolut di setting `trialEndTs`.
   Perpanjangan menambah ke nilai ini, bukan menghitung ulang dari firstInstallTs —
   supaya bonus hari tidak jatuh di masa lalu saat user baru buka app setelah trial habis. */
async function resolveTrialEndTs(){
  const stored = await getSetting("trialEndTs", null);
  if(typeof stored === "number" && isFinite(stored)) return stored;

  // Migrasi instalasi lama yang masih menyimpan firstInstallTs + trialExtendCount.
  const firstInstall = await getSetting("firstInstallTs", null);
  const extendCount = Number(await getSetting("trialExtendCount", 0)) || 0;
  let end;
  if(typeof firstInstall === "number" && isFinite(firstInstall)){
    end = firstInstall + (TRIAL_DAYS * DAY_MS) + (extendCount * TRIAL_EXTEND_DAYS_EACH * DAY_MS);
  } else {
    // Key identitas hilang/rusak: jangan berikan trial baru, arahkan ke aktivasi.
    end = 0;
  }
  await setSetting("trialEndTs", end);
  return end;
}

/* Lisensi aktif hanya dipercaya kalau serial tersimpan benar-benar cocok dengan
   perangkat ini. Menyalin database ke perangkat lain tidak lagi membawa status PRO. */
async function isLicenseActive(){
  const activated = await getSetting("licenseActivated", false);
  if(!activated) return false;
  const key = await getSetting("licenseKey", null);
  const deviceId = await getSetting("deviceId", null);
  if(key && deviceId && validateSerialWithDevice(key, deviceId)) return true;
  await setSetting("licenseActivated", false);
  return false;
}

async function updateTopbarLicenseInfo() {
  const container = document.getElementById("topbar-license-box");
  if (!container) return;

  const activated = await isLicenseActive();
  if (activated) {
    container.innerHTML = '<span class="badge ok" style="background:#fff;color:var(--green);padding:6px 10px">PRO</span>';
    return;
  }

  const trialEndTs = await resolveTrialEndTs();
  const diff = trialEndTs - Date.now();

  if (diff <= 0) {
    container.innerHTML = '<div class="trial-tag" style="background:var(--red)">MASA TRIAL<span id="topbar-trial-timer">Berakhir</span></div><button class="btn-activate" id="topbar-activate-btn">AKTIVASI</button>';
  } else {
    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const mins = Math.floor((diff % (60 * 60 * 1000)) / (60 * 1000));
    const timeStr = days > 0 ? days + " Hari" : String(hours).padStart(2,'0') + ":" + String(mins).padStart(2,'0');

    container.innerHTML = '<div class="trial-tag">TRIAL SISA<span id="topbar-trial-timer">' + timeStr + '</span></div><button class="btn-activate" id="topbar-activate-btn">AKTIVASI</button>';
  }
  const btn = document.getElementById("topbar-activate-btn");
  if (btn) btn.onclick = () => openActivationSheet();
}

let trialTimerInterval = null;
async function updateTopbarTrialInfo() {
  await updateTopbarLicenseInfo();

  async function refreshTimer(){
    const activated = await isLicenseActive();
    if(activated){
      if(trialTimerInterval){ clearInterval(trialTimerInterval); trialTimerInterval = null; }
      await updateTopbarLicenseInfo();
      return;
    }
    await updateTopbarLicenseInfo();
    // Trial habis di tengah sesi: kunci aplikasi tanpa menunggu reload.
    const status = await checkLicenseStatus();
    if(status.locked){
      if(trialTimerInterval){ clearInterval(trialTimerInterval); trialTimerInterval = null; }
      updateLockMessage(status);
      showLockScreen();
    }
  }

  if(trialTimerInterval) clearInterval(trialTimerInterval);
  trialTimerInterval = setInterval(refreshTimer, 60000);
}
window.__KG_UPDATE_TRIAL__ = updateTopbarTrialInfo;

async function checkLicenseStatus(){
  const activated = await isLicenseActive();
  if(activated) return {locked:false};
  const trialEndTs = await resolveTrialEndTs();
  const extendCount = Number(await getSetting("trialExtendCount", 0)) || 0;
  const locked = Date.now() > trialEndTs;
  return {locked, extendCount, trialEndTs};
}
function showLockScreen(){ document.getElementById("lock-screen").classList.remove("hidden"); }
function hideLockScreen(){ document.getElementById("lock-screen").classList.add("hidden"); }

function bindLockScreenEvents(){
  // Serial terikat perangkat: user wajib bisa membaca & mengirim Device ID dari lock screen.
  (async ()=>{
    const did = await getSetting("deviceId", null) || "-";
    const el = document.getElementById("lock-device-id");
    if(el) el.textContent = did;
    const copyBtn = document.getElementById("lock-copy-device");
    if(copyBtn) copyBtn.onclick = ()=>{
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(did).then(
          ()=> toast("ID Perangkat disalin","success"),
          ()=> toast("Gagal menyalin, catat manual: " + did, "error")
        );
      } else {
        toast("ID Perangkat: " + did, "info");
      }
    };
  })();

  document.getElementById("lock-activate-btn").onclick = async ()=>{
    const serial = document.getElementById("lock-serial-input").value.trim().toUpperCase();
    const deviceId = await getSetting("deviceId", null);
    if(!deviceId){
      toast("Gagal membaca device ID","error");
      return;
    }
    await activateWithSerial(serial, deviceId, ()=>{
      hideLockScreen();
      startApp();
    });
  };
  document.getElementById("lock-extend-btn").onclick = handleExtendTrial;
  document.getElementById("lock-wa-btn").onclick = ()=> window.open("https://wa.me/6208816566935","_blank");
  document.getElementById("lock-backup-btn").onclick = exportBackup;
}

async function handleExtendTrial(){
  const extendCount = Number(await getSetting("trialExtendCount", 0)) || 0;
  const lastDate = await getSetting("trialExtendLastDate", null);
  const now = new Date();
  if(extendCount >= TRIAL_EXTEND_MAX_TOTAL){
    toast("Batas perpanjangan trial sudah tercapai. Silakan aktivasi lisensi.","error");
    return;
  }
  if(lastDate && isSameDay(lastDate, now)){
    toast("Perpanjangan trial hanya bisa 1x per hari.","error");
    return;
  }
  const shareText = "Halo! Saya pakai Kasir Solo - Gerobak dari PT Mesin Kasir Solo untuk kelola jualan gerobak saya. Aplikasi kasir offline yang ringan & praktis. Cek di www.kasirsolo.app atau WA 08816566935";

  // Bonus hanya diberikan kalau share benar-benar terjadi. navigator.share menolak
  // (throw) saat user membatalkan; jalur window.open tidak bisa dikonfirmasi otomatis
  // sehingga user diminta mengonfirmasi sendiri setelah jendela WhatsApp terbuka.
  let shared = false;
  if(navigator.share){
    try {
      await navigator.share({title:"Kasir Solo - Gerobak", text:shareText, url:"https://www.kasirsolo.app"});
      shared = true;
    } catch(e){
      toast("Perpanjangan dibatalkan karena bagikan tidak selesai.","info");
      return;
    }
  } else {
    const win = window.open("https://wa.me/?text=" + encodeURIComponent(shareText), "_blank");
    if(!win){
      toast("Jendela WhatsApp diblokir browser. Izinkan pop-up lalu coba lagi.","error");
      return;
    }
    shared = await confirmDestructiveAsync("Sudah selesai membagikan aplikasi ke kontak WhatsApp Anda?\n\nTekan \"Ya, Lanjutkan\" hanya kalau pesannya benar-benar terkirim.");
    if(!shared){
      toast("Perpanjangan dibatalkan.","info");
      return;
    }
  }

  // Perpanjang dari batas trial saat ini, atau dari sekarang kalau trial sudah lewat,
  // supaya bonus hari selalu terasa oleh user (bukan jatuh di masa lalu).
  const currentEnd = await resolveTrialEndTs();
  const base = Math.max(currentEnd, Date.now());
  const newEnd = base + (TRIAL_EXTEND_DAYS_EACH * DAY_MS);
  await setSetting("trialEndTs", newEnd);
  await setSetting("trialExtendCount", extendCount + 1);
  await setSetting("trialExtendLastDate", now.getTime());
  toast("Trial diperpanjang +" + TRIAL_EXTEND_DAYS_EACH + " hari. Terima kasih sudah membagikan!","success");

  const status = await checkLicenseStatus();
  if(!status.locked){
    hideLockScreen();
    await updateTopbarLicenseInfo();
    await updateTopbarTrialInfo();
    startApp();
  } else {
    updateLockMessage(status);
  }
}
function updateLockMessage(status){
  const msgEl = document.getElementById("lock-msg");
  if(msgEl){
    msgEl.textContent = "Masa uji coba sudah berakhir. Anda sudah memperpanjang " + (status.extendCount||0) + "x dari maksimal " + TRIAL_EXTEND_MAX_TOTAL + "x. Aktifkan lisensi permanen untuk terus memakai aplikasi.";
  }
}

async function startApp(){
  await navigate(currentView);
}

async function boot(){
  try {
    await db.open();
    await seedIfEmpty();
    cart = await loadCartFromDb();

    let deviceId = await getSetting("deviceId", null);
    if(!deviceId){
      deviceId = generateDeviceId();
      await setSetting("deviceId", deviceId);
    }

    bindLockScreenEvents();

    document.querySelectorAll("#bottom-nav .nav-item[data-view]").forEach(function(b){ b.onclick = function(){ navigate(b.dataset.view); }; });
    document.querySelectorAll(".btn-header-icon[data-view]").forEach(function(b){ b.onclick = function(){ navigate(b.dataset.view); }; });
    document.getElementById("fab-pos").onclick = ()=> navigate("pos");
    document.getElementById("restore-file-input").onchange = async (e)=>{
      const file = e.target.files && e.target.files[0];
      // Reset value supaya memilih file yang sama dua kali tetap memicu onchange.
      e.target.value = "";
      if(file) await importBackup(file);
    };

    const status = await checkLicenseStatus();

    if(status.locked){
      updateLockMessage(status);
      showLockScreen();
    } else {
      await updateTopbarLicenseInfo();
      await updateTopbarTrialInfo();
      await startApp();
    }
  } catch(err) {
    console.error("[Boot] Fatal error:", err);
    console.error("[Boot] Stack:", err.stack);
    document.getElementById("view-wrap").innerHTML = `
      <div style="padding:20px;color:var(--text-danger);text-align:center;">
        <p><b>⚠️ Aplikasi gagal memuat</b></p>
        <p style="font-size:12px;word-break:break-word;margin-top:10px">${escapeHtml(err.message)}</p>
        <p style="font-size:11px;color:var(--text-mute);margin-top:10px">Silakan refresh halaman atau buka browser console untuk details.</p>
      </div>
    `;
    toast("Aplikasi gagal memuat: " + err.message, "error");
  }
}

if(document.readyState === "loading"){
  document.addEventListener("DOMContentLoaded", function() {
    boot().catch(err => {
      console.error("Boot failed:", err);
      console.error("Stack:", err.stack);
      toast("Aplikasi gagal memuat: " + err.message, "error");
    });
  });
} else {
  boot().catch(err => {
    console.error("Boot failed:", err);
    console.error("Stack:", err.stack);
    toast("Aplikasi gagal memuat: " + err.message, "error");
  });
}

if("serviceWorker" in navigator && window.location.protocol !== 'file:'){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw-gerobak.js").then(function(reg){
      // Kalau ada versi baru, minta SW baru langsung aktif supaya HTML tidak stale.
      reg.addEventListener("updatefound", function(){
        const nw = reg.installing;
        if(!nw) return;
        nw.addEventListener("statechange", function(){
          if(nw.state === "installed" && navigator.serviceWorker.controller){
            nw.postMessage({ type: "SKIP_WAITING" });
          }
        });
      });
    }).catch(function(err){
      console.warn("Service Worker registration failed:", err);
    });
    let swReloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", function(){
      if(swReloaded) return;
      swReloaded = true;
      location.reload();
    });
  });
}

})();
