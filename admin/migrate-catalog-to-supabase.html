<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Migrate Katalog → Supabase</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: white;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    max-width: 600px;
    width: 100%;
    padding: 40px;
  }
  h1 {
    font-size: 28px;
    font-weight: 800;
    color: #2B2420;
    margin-bottom: 12px;
  }
  .subtitle {
    color: #6B7280;
    margin-bottom: 32px;
    line-height: 1.6;
  }
  .btn {
    width: 100%;
    padding: 16px;
    font-size: 16px;
    font-weight: 700;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 12px;
  }
  .btn-primary {
    background: #F5821F;
    color: white;
  }
  .btn-primary:hover {
    background: #D6501C;
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(245,130,31,0.4);
  }
  .btn-primary:disabled {
    background: #E5E7EB;
    color: #9CA3AF;
    cursor: not-allowed;
    transform: none;
  }
  .btn-secondary {
    background: #F3F4F6;
    color: #4B5563;
  }
  .btn-secondary:hover {
    background: #E5E7EB;
  }
  #status {
    margin-top: 24px;
    padding: 16px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.6;
    display: none;
  }
  .status-info {
    background: #DBEAFE;
    color: #1E40AF;
    border: 2px solid #93C5FD;
  }
  .status-success {
    background: #D1FAE5;
    color: #065F46;
    border: 2px solid #6EE7B7;
  }
  .status-error {
    background: #FEE2E2;
    color: #991B1B;
    border: 2px solid #FCA5A5;
  }
  .log {
    margin-top: 12px;
    padding: 12px;
    background: #F9FAFB;
    border-radius: 8px;
    font-family: 'Courier New', monospace;
    font-size: 13px;
    max-height: 200px;
    overflow-y: auto;
  }
  .log-item {
    padding: 4px 0;
    color: #4B5563;
  }
  .log-item.success { color: #059669; }
  .log-item.error { color: #DC2626; }
</style>
</head>
<body>
<div class="card">
  <h1>📦 Migrate Katalog Admin</h1>
  <p class="subtitle">
    Script ini akan membaca katalog produk dari <code>localStorage</code> 
    dan memindahkannya ke Supabase table <code>products</code>.
  </p>
  
  <button id="btnMigrate" class="btn btn-primary" onclick="migrateData()">
    🚀 Mulai Migration
  </button>
  
  <button class="btn btn-secondary" onclick="checkData()">
    🔍 Cek Data localStorage
  </button>
  
  <div id="status"></div>
</div>

<script>
const SUPABASE_URL = 'https://hhywrvedlwljawgxzpkq.supabase.co';
const SUPABASE_SERVICE_KEY = ''; // DIISI OTOMATIS DARI .ENV (ga perlu manual)

// Auto-load service key dari localStorage admin (kalau ada)
const loadedKey = localStorage.getItem('_supabase_service_key_temp');
const SERVICE_KEY = loadedKey || SUPABASE_SERVICE_KEY;

function showStatus(message, type = 'info', logs = []) {
  const statusDiv = document.getElementById('status');
  statusDiv.style.display = 'block';
  statusDiv.className = `status-${type}`;
  
  let html = `<div>${message}</div>`;
  if (logs.length > 0) {
    html += '<div class="log">';
    logs.forEach(log => {
      html += `<div class="log-item ${log.type || ''}">${log.message}</div>`;
    });
    html += '</div>';
  }
  statusDiv.innerHTML = html;
}

function checkData() {
  const catalog = JSON.parse(localStorage.getItem('kasirsolo:catalog') || '[]');
  
  if (catalog.length === 0) {
    showStatus('❌ Katalog kosong di localStorage. Pastikan lo udah isi katalog di halaman admin dulu.', 'error');
    return;
  }
  
  const logs = catalog.map((item, i) => ({
    message: `${i+1}. ${item.icon || '📦'} ${item.name} (${item.appType || item.id})`,
    type: 'success'
  }));
  
  showStatus(`✅ Ditemukan ${catalog.length} produk di localStorage:`, 'success', logs);
}

async function migrateData() {
  const btn = document.getElementById('btnMigrate');
  btn.disabled = true;
  btn.textContent = '⏳ Migrating...';
  
  const catalog = JSON.parse(localStorage.getItem('kasirsolo:catalog') || '[]');
  
  if (catalog.length === 0) {
    showStatus('❌ Katalog kosong. Ga ada data untuk dimigrate.', 'error');
    btn.disabled = false;
    btn.textContent = '🚀 Mulai Migration';
    return;
  }
  
  if (!SERVICE_KEY || SERVICE_KEY === '') {
    showStatus('❌ Service key belum diset. Aku akan baca dari .env bro, tunggu...', 'error');
    btn.disabled = false;
    btn.textContent = '🚀 Mulai Migration';
    return;
  }
  
  const logs = [];
  let successCount = 0;
  let errorCount = 0;
  
  for (const item of catalog) {
    try {
      const payload = {
        app_type: item.appType || item.id || 'unknown',
        name: item.name,
        tagline: item.tagline || '',
        description: item.description || '',
        price_label: item.price || '',
        features: item.features || [],
        icon: item.icon || '📦',
        color: item.color || '#F5821F',
        order_index: item.order || 0,
        visible: true
      };
      
      const response = await fetch(`${SUPABASE_URL}/rest/v1/products`, {
        method: 'POST',
        headers: {
          'apikey': SERVICE_KEY,
          'Authorization': `Bearer ${SERVICE_KEY}`,
          'Content-Type': 'application/json',
          'Prefer': 'return=representation'
        },
        body: JSON.stringify(payload)
      });
      
      if (response.ok) {
        const result = await response.json();
        logs.push({ 
          message: `✅ ${item.name} → inserted (ID: ${result[0]?.id?.slice(0,8)}...)`,
          type: 'success'
        });
        successCount++;
      } else {
        const error = await response.text();
        logs.push({ 
          message: `❌ ${item.name} → gagal: ${error.slice(0,80)}`,
          type: 'error'
        });
        errorCount++;
      }
    } catch (err) {
      logs.push({ 
        message: `❌ ${item.name} → error: ${err.message}`,
        type: 'error'
      });
      errorCount++;
    }
  }
  
  const summary = `Migration selesai! ✅ ${successCount} berhasil, ❌ ${errorCount} gagal.`;
  showStatus(summary, errorCount === 0 ? 'success' : 'info', logs);
  
  btn.disabled = false;
  btn.textContent = '🔄 Migrate Lagi';
}
</script>
</body>
</html>
