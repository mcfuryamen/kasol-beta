  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDBA5C"/>
      <stop offset="0.55" stop-color="#F5821F"/>
      <stop offset="1" stop-color="#D6501C"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- kait atas -->
  <path d="M256 56 a26 26 0 1 1 26 -26" stroke="#FFFFFF" stroke-width="18" fill="none" stroke-linecap="round" transform="translate(0,26)"/>
