<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Logo Kasir Solo Kaki Lima — gerobak v2: siluet utuh (kanopi solid + jendela layanan
       + gagang tersambung + roda besar). Full-bleed persegi. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F5821F"/>
      <stop offset="0.55" stop-color="#D6501C"/>
      <stop offset="1" stop-color="#B04018"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- kanopi solid ber-scallop -->
  <path d="M96 92 H416 V148 A53.3 53.3 0 0 1 309.3 148 A53.3 53.3 0 0 1 202.6 148 A53.3 53.3 0 0 1 96 148 Z" fill="#FFFFFF"/>
  <!-- tiang penghubung kanopi ke bodi -->
  <rect x="122" y="140" width="26" height="54" fill="#FFFFFF"/>
  <rect x="364" y="140" width="26" height="54" fill="#FFFFFF"/>
  <!-- bodi gerobak -->
  <rect x="112" y="186" width="288" height="144" rx="30" fill="#FFFFFF"/>
  <!-- jendela layanan (menembus ke gradasi) -->
  <rect x="162" y="216" width="188" height="46" rx="20" fill="url(#bg)"/>
  <!-- gagang dorong tersambung di sudut kiri-bawah bodi -->
  <path d="M116 288 L 54 322" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round"/>
  <!-- roda besar -->
  <circle cx="256" cy="398" r="54" fill="none" stroke="#FFFFFF" stroke-width="24"/>
  <circle cx="256" cy="398" r="13" fill="#FFFFFF"/>
</svg>
