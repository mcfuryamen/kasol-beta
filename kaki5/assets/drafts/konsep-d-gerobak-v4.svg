<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Logo Kasir Solo Kaki Lima — gerobak v4: kanopi overhang + scallop sedang,
       bodi dengan jendela layanan, gagang, roda. Full-bleed persegi. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F5821F"/>
      <stop offset="0.55" stop-color="#D6501C"/>
      <stop offset="1" stop-color="#B04018"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- kanopi melebihi bodi (overhang), scallop sedang -->
  <path d="M98 108 H414 V156 A75 75 0 0 1 308.7 156 A75 75 0 0 1 203.3 156 A75 75 0 0 1 98 156 Z" fill="#FFFFFF"/>
  <!-- bodi gerobak -->
  <rect x="112" y="156" width="288" height="148" rx="30" fill="#FFFFFF"/>
  <!-- jendela layanan -->
  <rect x="162" y="188" width="188" height="46" rx="20" fill="url(#bg)"/>
  <!-- gagang dorong -->
  <path d="M116 262 L 54 296" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round"/>
  <!-- roda -->
  <circle cx="256" cy="380" r="54" fill="none" stroke="#FFFFFF" stroke-width="24"/>
  <circle cx="256" cy="380" r="13" fill="#FFFFFF"/>
</svg>
