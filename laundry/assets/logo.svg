<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Logo Kasir Solo Laundry — full-bleed persegi (aman semua mask), gradasi brand laundry -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCD34D"/>
      <stop offset="0.55" stop-color="#F97316"/>
      <stop offset="1" stop-color="#DC2626"/>
    </linearGradient>
    <clipPath id="drum"><circle cx="256" cy="284" r="118"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- gelembung sabun -->
  <circle cx="132" cy="104" r="30" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="196" cy="70" r="18" fill="#FFFFFF" opacity="0.75"/>
  <circle cx="170" cy="160" r="13" fill="#FFFFFF" opacity="0.6"/>
  <!-- drum mesin cuci -->
  <circle cx="256" cy="284" r="133" fill="#FFFFFF" opacity="0.16"/>
  <g clip-path="url(#drum)">
    <rect x="120" y="316" width="272" height="120" fill="#FFFFFF" opacity="0.85"/>
    <path d="M120 322 q29 -26 58 0 t58 0 t58 0 t58 0 t40 0" stroke="#FFFFFF" stroke-width="12" fill="none" stroke-linecap="round"/>
  </g>
  <circle cx="256" cy="284" r="133" fill="none" stroke="#FFFFFF" stroke-width="28"/>
  <!-- tombol/panel atas mesin -->
  <rect x="196" y="118" width="120" height="14" rx="7" fill="#FFFFFF" opacity="0.9"/>
</svg>
