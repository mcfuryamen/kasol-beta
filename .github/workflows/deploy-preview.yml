name: Deploy Preview → kaki5.vercel.app

on:
  push:
    branches: [preview]

# Cancel in-progress deployments for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Allow OIDC token for Vercel login (no permanent VERCEL_TOKEN needed)
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to Vercel (Production)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # OIDC: Vercel verifies the GitHub OIDC token directly
      # No permanent VERCEL_TOKEN secret needed
      - name: Deploy to Vercel (Production)
        run: |
          vercel pull --yes --environment=production \
            --token="${VERCEL_TOKEN}" \
            --scope=mcfury 2>&1 || true
          vercel deploy --yes --prod \
            --token="${VERCEL_TOKEN}" \
            --scope=mcfury \
            --cwd=kaki5
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Verify deployment
        run: |
          echo "✅ Preview deployed ke: https://kaki5.vercel.app"
          echo "✅ Commit: ${{ github.sha }}"
          echo "✅ Branch: ${{ github.ref_name }}"
