name: Deploy All (Fallback Manual)

# Manual fallback: jalan via tombol "Run workflow" di Actions.
# Jalur otomatis harian ditangani oleh masing-masing deploy-<app>.yml
# yang punya path filter (push ke rosok/** hanya memicu deploy rosok).
#
# Gunakan ini untuk memaksa deploy beberapa/total app sekaligus,
# atau jika workflow per-app bermasalah. Deteksi per-folder tetap
# menggunakan dorny/paths-filter, jadi app tanpa perubahan TIDAK di-deploy.

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      rosok: ${{ steps.filter.outputs.rosok }}
      gerobak: ${{ steps.filter.outputs.gerobak }}
      retail: ${{ steps.filter.outputs.retail }}
      landing: ${{ steps.filter.outputs.landing }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            rosok:
              - 'rosok/**'
            gerobak:
              - 'gerobak/**'
            retail:
              - 'retail/**'
            landing:
              - 'landing/**'

  deploy-rosok:
    needs: check
    if: needs.check.outputs.rosok == 'true'
    uses: ./.github/workflows/deploy-rosok.yml
    secrets: inherit

  deploy-gerobak:
    needs: check
    if: needs.check.outputs.gerobak == 'true'
    uses: ./.github/workflows/deploy-gerobak.yml
    secrets: inherit

  deploy-retail:
    needs: check
    if: needs.check.outputs.retail == 'true'
    uses: ./.github/workflows/deploy-retail.yml
    secrets: inherit

  deploy-landing:
    needs: check
    if: needs.check.outputs.landing == 'true'
    uses: ./.github/workflows/deploy-landing.yml
    secrets: inherit
